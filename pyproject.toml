[project]
name = "sumologic-search-job-api-reference"
version = "0.4.0"
description = "Standalone reference client, tests, and Agent Skills for the Sumo Logic Search Job REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
cli = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
sumosearch = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.setuptools]
py-modules = ["sumo_search_client"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = true
